when:
  event:
    - push
    - pull_request
    - manual

steps:
  unit-tests:
    image: golang:1.25.1-alpine
    environment:
      CGO_ENABLED: "0"
    commands:
      - go test ./...

  coverage-tests:
    image: golang:1.25.1-alpine
    environment:
      CGO_ENABLED: "0"
    commands:
      - go test -cover ./...

  race-detection:
    image: golang:1.25.1
    environment:
      CGO_ENABLED: "1"
    commands:
      - go test -race ./...

  specific-tests:
    image: golang:1.25.1-alpine
    environment:
      CGO_ENABLED: "0"
    commands:
      - go test -run TestChatComplete

  integration-test:
    image: golang:1.25.1-alpine
    environment:
      CGO_ENABLED: "0"
      ORAPIKEY:
        from_secret: openrouter_api_key
    commands:
      - go run cmd/openrouter-test/main.go -key $ORAPIKEY -test all -model "google/gemini-3-flash-preview" -embedding-model "qwen/qwen3-embedding-8b"

  integration-test-analytics:
    image: golang:1.25.1-alpine
    environment:
      CGO_ENABLED: "0"
      ORPROVKEY:
        from_secret: openrouter_provisioning_key
    commands:
      - go run cmd/openrouter-test/main.go -key $ORPROVKEY -test activity
      - go run cmd/openrouter-test/main.go -key $ORPROVKEY -test key
      - go run cmd/openrouter-test/main.go -key $ORPROVKEY -test listkeys
      - go run cmd/openrouter-test/main.go -key $ORPROVKEY -test createkey
      - go run cmd/openrouter-test/main.go -key $ORPROVKEY -test updatekey
      - go run cmd/openrouter-test/main.go -key $ORPROVKEY -test deletekey

  webhook-notification:
    image: plugins/webhook
    settings:
      urls:
        from_secret: webhook_url
      content_type: application/json
      template: |
        {
          "repo": "{{ repo.full_name }}",
          "commit": "{{ build.commit }}",
          "branch": "{{ build.branch }}",
          "status": "{{ build.status }}",
          "event": "{{ build.event }}",
          "author": "{{ build.author }}",
          "link": "{{ build.link }}",
          "started": "{{ build.started }}",
          "finished": "{{ build.finished }}",
          "tag": "{{ build.tag }}"
        }
